version: '3.7'

services:
  db:
    container_name: mysql
    image: mysql:8.0
    #    перезапускаем всегда при каком то сбое
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - server


  redis:
    container_name: redis
    image: redis:7.2
    restart: always
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - server


  node:
    container_name: node
    image: node:18
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - .:/usr/src/app/
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run dev"
    networks:
      - server



volumes:
  mysql_data:
  redis_data:

networks:
  server:
    driver: bridge